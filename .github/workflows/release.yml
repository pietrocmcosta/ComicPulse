name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare Signing Keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/comicpulse-release.jks ]; then
            keytool -genkeypair -v \
              -keystore keystore/comicpulse-release.jks \
              -alias comicpulse \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass comicpulse \
              -keypass comicpulse \
              -dname "CN=ComicPulse, OU=Mobile, O=ComicPulse, L=Sao Paulo, ST=SP, C=BR"
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare Release APK
        id: prep
        run: |
          VERSION=$(grep 'versionName =' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' | head -n 1)
          APK_NAME="comicpulse_${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "ComicPulse v${{ steps.prep.outputs.version }}"
          body: |
            ## ComicPulse v${{ steps.prep.outputs.version }}
            - Added full Portuguese (`pt`) localization across all screens, menus, and dialogs.
            - Added in-app Language Switcher in Settings (`System Default`, `English`, `Português`) alongside automatic system locale detection.
            - Download the attached `${{ steps.prep.outputs.apk_name }}` below to install on your Android device.
          files: ${{ steps.prep.outputs.apk_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
